<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paisley RFC S&amp;C</title>
<meta name="description" content="Paisley RFC strength and conditioning: leaderboards, club records, your own targets and radars, and the league table.">
<meta name="theme-color" content="#162351">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paisley S&amp;C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--navy:#162351;--navy2:#22336E;--red:#A81D22;--red2:#C0262C;--slate:#404F6F;--bg:#F2F3F7;--card:#FFFFFF;--line:#E2E5EE;--ink:#121933;--muted:#5C6582;--faint:#8A92AA;--tint:#E8EBF3;--green:#13704F;--greenbg:#E3F3EC;--amber:#8A5A00;--amberbg:#FFF2D6;--redbg:#FBE9EA;--gold:#C99A2E;--silver:#8E98AC;--bronze:#A86A3D;--r:14px;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Roboto,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red);text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 14px}
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--red)}
.topin{display:flex;align-items:center;gap:12px;height:62px}
.crest{width:40px;height:40px;object-fit:contain;flex:none}
.brand{line-height:1.1;min-width:0}
.club{font-family:Orbitron,Roboto,sans-serif;font-weight:800;letter-spacing:.06em;font-size:17px;white-space:nowrap}
.sub{font-size:12px;color:#C9D0E6;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnav{margin-left:auto;display:none;gap:4px}
.dnav button{background:none;border:0;color:#C9D0E6;padding:9px 14px;border-radius:999px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:7px}
.dnav button.on{background:rgba(255,255,255,.12);color:#fff}
.dnav button:hover{color:#fff}
main.wrap{padding-top:16px;padding-bottom:calc(92px + var(--safe))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe)}
.bnav button{flex:1;background:none;border:0;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--faint);cursor:pointer}
.bnav button.on{color:var(--red)}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dnav .ico{width:18px;height:18px}
h1,h2,h3{margin:0}
.h-sec{font-family:Orbitron,Roboto,sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);display:flex;align-items:center;gap:8px;margin:0 0 12px}
.h-sec .more{margin-left:auto;font-family:Roboto,sans-serif;letter-spacing:0;text-transform:none;font-size:13px;font-weight:500;color:var(--red);cursor:pointer;background:none;border:0;padding:0}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.hero{background:var(--navy);color:#fff;border:0;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:22px solid rgba(255,255,255,.05)}
.kick{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#AEB8D8;font-weight:500}
.hero .big{font-family:Orbitron,Roboto,sans-serif;font-weight:700;font-size:19px;margin:6px 0 2px;line-height:1.25}
.hero .meta{color:#C9D0E6;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:rgba(255,255,255,.08);border-radius:10px;padding:10px}
.stat b{display:block;font-size:20px;font-weight:700}
.stat span{font-size:11px;color:#C9D0E6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px}
.btn.red{background:var(--red);color:#fff}
.btn.red:active{background:var(--red2)}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:var(--tint);color:var(--navy)}
.btn.line{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.green{background:var(--green);color:#fff}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.ctas{display:flex;gap:10px;margin-bottom:14px}
.ctas .btn{flex:1}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.grow{flex:1;min-width:0}
.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right;flex:none}
.val{font-weight:700;font-variant-numeric:tabular-nums}
.share{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#E7F6EE;color:#128C4B;flex:none}
.share .ico{width:18px;height:18px}
.recs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rec{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.rec .lab{font-size:12px;color:var(--muted);font-weight:500}
.rec .v{font-size:20px;font-weight:700;color:var(--navy);margin:4px 0 2px;font-variant-numeric:tabular-nums}
.rec .who{font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--slate)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg{display:flex;background:var(--tint);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-weight:500;font-size:13px;color:var(--slate);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(18,25,51,.12)}
.lb{display:flex;flex-direction:column}
.lbr{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line)}
.lbr:first-child{border-top:0}
.lbr.me{background:#FFF6E0;border-radius:10px;border-top-color:transparent}
.rk{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--slate);background:var(--tint);flex:none}
.rk.g1{background:var(--gold);color:#fff}.rk.g2{background:var(--silver);color:#fff}.rk.g3{background:var(--bronze);color:#fff}
.lbv{font-size:17px}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--greenbg);color:var(--green)}
.pill.close{background:var(--amberbg);color:var(--amber)}
.pill.low{background:var(--redbg);color:var(--red)}
.pill.none{background:var(--tint);color:var(--muted)}
.bars .row{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.bars .row:first-child{border-top:0}
.bar{height:9px;background:var(--tint);border-radius:9px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:9px}
.bpair{display:grid;grid-template-columns:1fr 38px;gap:6px;align-items:center;font-size:12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tile .lab{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.tile .num{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0 8px}
.tile.main{background:var(--navy);color:#fff;border:0}
.tile.main .lab{color:#AEB8D8}
.tile.main .bar{background:rgba(255,255,255,.15)}
.mehead{display:flex;align-items:center;gap:14px}
.mehead .av{width:54px;height:54px;font-size:19px;background:var(--red);color:#fff}
.mehead h1{font-size:22px;line-height:1.15}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{background:var(--tint);color:var(--navy);font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px}
.trow{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.trow:first-child{border-top:0;padding-top:2px}
.tname{font-size:13px;color:var(--muted);font-weight:500}
.tval{font-size:19px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px;margin:1px 0}
.tsub{font-size:12px;color:var(--muted)}
.cathd{font-size:12px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 2px}
.h-sec + .cathd{margin-top:0}
.cathd + .trow{border-top:0;padding-top:4px}
.tright{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.rlist .item{padding:9px 0}
.rlist .rv{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.fsum{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
.fsum .u{background:#F7F8FB;border:1px solid var(--line);border-radius:12px;padding:12px}
.fsum .u b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.fsum .u div{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.linkbtn{background:none;border:0;color:var(--red);font-weight:500;padding:6px 0;cursor:pointer;font-size:14px}
.tg{margin-bottom:8px}
.tgl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.tgc{display:flex;flex-wrap:wrap;gap:6px}
.pbt{padding:7px 11px}
.spark{width:74px;height:24px;display:block}
.delta{font-size:12px;font-weight:700}
.delta.up{color:var(--green)}.delta.dn{color:var(--red)}
.focus{display:flex;flex-direction:column;gap:8px}
.focus .f{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--redbg)}
.focus .f b{color:var(--red);font-size:15px}
.radars{display:grid;grid-template-columns:1fr;gap:14px}
.radar{position:relative}
.radar h3{font-size:14px;color:var(--navy);margin-bottom:6px}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}
.empty .em{font-size:30px;margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:500;color:var(--slate)}
.inp{width:100%;border:1px solid #CCD2E0;border-radius:12px;padding:12px;background:#fff;font-size:16px;outline:none}
.inp:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(22,35,81,.12)}
.err{color:var(--red);font-size:13px;margin:-4px 0 10px;min-height:0}
.hint{font-size:12px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,14,30,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + var(--safe));max-height:92vh;overflow:auto}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:#D5DAE6;margin:0 auto 12px}
.sheet h2{font-family:Orbitron,Roboto,sans-serif;font-size:17px;color:var(--navy);margin-bottom:14px}
.done{text-align:center;padding:10px 0}
.done .tick{width:64px;height:64px;border-radius:50%;background:var(--greenbg);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:32px;font-weight:700}
.done .tick.wait{background:var(--amberbg);color:var(--amber)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe));background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.notice{background:var(--amberbg);color:var(--amber);border-radius:12px;padding:12px;font-size:14px;margin-bottom:14px}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctrls .field{margin-bottom:8px}
.prow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.prow.dirty{border-color:var(--navy);box-shadow:0 0 0 2px rgba(22,35,81,.08)}
.prow.full .pn:after{content:"✓";color:var(--green);margin-left:6px;font-weight:700}
.prow.unav{opacity:.55}
.pn{font-weight:700;display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.pn small{font-weight:400;color:var(--muted);font-size:12px}
.pins{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pf{display:flex;flex-direction:column;gap:3px}
.pf span{font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf input{border:1px solid #CCD2E0;border-radius:10px;padding:10px 8px;font-size:16px;width:100%;font-variant-numeric:tabular-nums;outline:none;background:#fff}
.pf input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(22,35,81,.12)}
.pf input.chg{background:#EEF1FA;border-color:var(--navy)}
.pf input.warn{background:var(--amberbg);border-color:#D9A43A}
.savebar{position:fixed;left:0;right:0;bottom:calc(58px + var(--safe));z-index:25;padding:10px 14px;background:rgba(242,243,247,.94);backdrop-filter:blur(6px);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.savebar .grow{font-size:13px;color:var(--slate)}
.inb{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.inb .top2{display:flex;align-items:center;gap:10px}
.inb .acts{display:flex;gap:8px;margin-top:10px}
.inb .acts .btn{flex:1}
.chk{font-size:13px;margin-top:6px;font-weight:500}
.chk.ok{color:var(--green)}.chk.bad{color:var(--amber)}
.pre{white-space:pre-wrap;background:#F7F8FB;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;line-height:1.5}
.badge{background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;margin-left:4px}
.sk{background:linear-gradient(90deg,#ECEEF4,#F6F7FA,#ECEEF4);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px;height:16px;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
.foot{text-align:center;color:var(--faint);font-size:12px;margin:18px 0 8px}
.how{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.how+.how{border-top:1px solid var(--line)}
.how>b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;margin-bottom:6px}
.cal .h{font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.04em;padding-bottom:2px}
.cal .d{padding:6px 0 4px;border-radius:9px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.cal .d.past{color:#B4BACB}
.cal .d.today{background:var(--navy);color:#fff;font-weight:700}
.cal .dots{display:flex;gap:3px;justify-content:center;height:6px;margin-top:3px}
.cal .dots i{width:6px;height:6px;border-radius:50%}
.k-game{background:var(--red)}.k-testing{background:var(--navy)}.k-session{background:var(--gold)}
.cal .d.today .k-testing{background:#fff}
.ag{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ag .dt{flex:none;width:46px;text-align:center;border-radius:10px;padding:5px 0;background:var(--tint);line-height:1.1}
.ag .dt b{display:block;font-size:17px;color:var(--navy)}.ag .dt span{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.ag .kb{width:4px;align-self:stretch;border-radius:4px;flex:none}
.legend2{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:4px 0 2px}
.legend2 span{display:inline-flex;align-items:center;gap:5px}.legend2 i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tag.sl{background:#FFF2D6;color:#8A5A00}.tag.ck{background:var(--greenbg);color:var(--green)}
.privacy ul{margin:8px 0 12px 18px;padding:0}.privacy li{margin:6px 0}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.choice .btn{white-space:normal;line-height:1.25}
.banner{position:fixed;left:12px;right:12px;bottom:calc(76px + var(--safe));z-index:30;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:13px;max-width:560px;margin:0 auto}
.banner a{color:#fff;font-weight:700}
.csum{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.csum .c{flex:1 1 140px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.csum .c b{display:block;font-size:18px;color:var(--navy)}.csum .c span{font-size:12px;color:var(--muted)}
#printarea{display:none}
.sqr{display:grid;grid-template-columns:1.4fr 1fr;gap:6px 8px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.sqr .name{grid-column:1/-1}
.sqr select.inp{padding:8px 10px;font-size:14px}
.sqr.chg .name{color:var(--navy)}.sqr.chg select{border-color:var(--navy)}
@media (min-width:720px){.sqr{grid-template-columns:1.2fr 1.4fr 1fr}.sqr .name{grid-column:auto}}
@media print{
  body.printing>*:not(#printarea){display:none!important}
  body.printing #printarea{display:block}
  body.printing{background:#fff}
  .pp{page-break-after:always;font-family:Roboto,Arial,sans-serif;color:#000}
  .pp h1{font-size:16px;margin:0 0 4px;letter-spacing:.06em}
  .pp .meta2{font-size:12px;margin:0 0 10px}
  .pp table{width:100%;border-collapse:collapse;font-size:12px}
  .pp th,.pp td{border:1px solid #777;padding:5px 6px;text-align:left}
  .pp td{height:24px}
  .pp th{background:#eee}
}
.btn.lite{background:transparent;border:1px solid transparent;color:var(--muted);padding-left:8px;padding-right:8px}
.btn.sure{background:var(--red);border-color:var(--red);color:#fff}
.lg{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.lg th{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
.lg td{padding:10px 4px;text-align:center;border-bottom:1px solid var(--line);font-size:14px}
.lg .t{text-align:left}
.lg td.pos{width:24px;color:var(--muted);font-weight:700}
.lg td.t{font-weight:500;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.lg td.pts{font-weight:800;color:var(--navy)}
.lg tr.us td{background:#FFF6E0}
.lg tr.us td.t{font-weight:700;color:var(--red)}
.res{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:6px;font-weight:800;font-size:12px;padding:0 6px}
.res.rW{background:var(--greenbg);color:var(--green)}.res.rL{background:var(--redbg);color:var(--red)}.res.rD{background:var(--amberbg);color:var(--amber)}.res.rP{background:var(--tint);color:var(--muted)}
@media (min-width:720px){
  .lg td.t{max-width:none}
  .recs{grid-template-columns:repeat(3,1fr)}
  .fsum{grid-template-columns:1fr 1fr}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .radars{grid-template-columns:1fr 1fr}
  .sheet{border-radius:20px;margin-bottom:6vh}
  .overlay{align-items:center}
}
@media (min-width:960px){
  .dnav{display:flex}
  .bnav{display:none}
  main.wrap{padding-bottom:40px}
  #prows{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #prows .prow{margin:0}
  .savebar{bottom:0}
  .toast{bottom:28px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .cols>div>.card:last-child{margin-bottom:14px}
  .club{font-size:19px}
}
</style>

<body>
<header class="top"><div class="wrap topin">
  <img class="crest" id="crest" alt="">
  <div class="brand"><div class="club">PAISLEY RFC</div><div class="sub" id="sub">S&amp;C</div></div>
  <nav class="dnav" id="dnav"></nav>
</div></header>
<main class="wrap" id="view"></main>
<nav class="bnav" id="bnav"></nav>
<div id="modal"></div>
<div id="banner"></div>
<div id="printarea"></div>
<div class="toast" id="toast"></div>
<script>
var B = /*BOOT*/null;
// The page runs two ways: inside Google's link (data comes with the page) or as the club web page (data comes from this script URL).
var API = 'https://script.google.com/macros/s/AKfycbwoXuRTZ2xryCegThEj7ZcfGcWf8KRR27_PZTU8IT8B-xTBFS6xBKpWfF6z2wBhfwxBSQ/exec';
var GAS = !!(window.google && google.script && google.script.run);
if (!B) B = webBoot();
function webBoot(){
  var q = new URLSearchParams(location.search), path = location.pathname;
  var isCoach = /\/coach\/?(index\.html)?$/.test(path);
  var base = location.origin + path.replace(/coach\/?(index\.html)?$/, '').replace(/index\.html$/, '');
  return {web: true, appUrl: base, coach: isCoach || q.has('coach'), token: (q.get('p') || '').trim()};
}
var ICONS = {
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  trophy: '<path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  clip: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 11h6M9 15h4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  share: '<path d="M4 20l1.4-4A8 8 0 1 1 8 19.6L4 20z"/>',
  ext: '<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  table: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/>',
  reset: '<path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/>'
};
function ic(n){ return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[n] + '</svg>'; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var LS = {
  get: function(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } },
  set: function(k,v){ try { window.localStorage.setItem(k,v); } catch(e){} },
  del: function(k){ try { window.localStorage.removeItem(k); } catch(e){} }
};
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function todayIso(){ var d = new Date(); return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
function dShort(iso){ if(!iso) return ''; var p = iso.split('-'); return Number(p[2]) + ' ' + MON[Number(p[1])-1]; }
function dLong(iso){ if(!iso) return ''; var p = iso.split('-'); var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2])); return DAY[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; }
function initials(n){ return String(n||'').split(/\s+/).filter(Boolean).slice(0,2).map(function(x){ return x[0]; }).join('').toUpperCase(); }

function saved(k){ try { return JSON.parse(LS.get(k) || 'null'); } catch(e){ return null; } }
var S = {
  view: 'home', squad: B.squad || null, me: B.me || null, league: B.league || null,
  token: B.token || LS.get('prfc_token') || '', pin: LS.get('prfc_pin') || '',
  coach: null, coachErr: '', ctab: 'testing',
  board: {key: 'Overall', grp: 'Squad'},
  t: {round: '', station: 'Sprints', date: todayIso(), q: '', dirty: {}},
  busy: false
};
// On the club web page, show the last copy straight away (and when there is no signal), then refresh it.
if (B.web) {
  if (!S.squad) S.squad = saved('prfc_squad');
  if (!S.league) S.league = saved('prfc_league');
  var lastMe = saved('prfc_me');
  if (!S.me && S.token && lastMe && lastMe.token === S.token) S.me = lastMe.me;
}
if (B.token && B.me) LS.set('prfc_token', B.token);
if (B.badToken) { LS.del('prfc_token'); S.token = ''; S.linkGone = true; }
if (B.coach) { S.view = 'coach'; LS.set('prfc_coachmode', '1'); }
else if (B.me || (B.web && B.token)) S.view = 'me';
var TM = {};
function indexTests(){ TM = {}; if (!S.squad) return; S.squad.tests.forEach(function(t){ TM[t.key] = t; }); S.squad.pbTests.forEach(function(t){ if (!TM[t.key]) TM[t.key] = t; }); }
indexTests();
function appUrl(){ return (S.squad && S.squad.appUrl) || B.appUrl; }

var NOSIG = 'No signal right now. Nothing is lost: try again when you’re back online.';
function call(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  if (GAS) return new Promise(function(res, rej){
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function(e){
      var m = e && e.message ? e.message : String(e);
      rej(new Error(/NetworkError|HTTP 0|Failed to fetch|connection/i.test(m) ? NOSIG : m));
    });
    r[fn].apply(r, args);
  });
  return fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({fn: fn, args: args})})
    .then(function(r){ return r.text(); }, function(){ throw new Error(NOSIG); })
    .then(function(t){
      var j; try { j = JSON.parse(t); } catch(e){ throw new Error('The app had a hiccup. Try again in a moment.'); }
      if (!j.ok) throw new Error(j.error || 'Something went wrong.');
      return j.data;
    });
}
function keep(){
  if (!B.web) return;
  try {
    if (S.squad) LS.set('prfc_squad', JSON.stringify(S.squad));
    if (S.league) LS.set('prfc_league', JSON.stringify(S.league));
    if (S.me && S.token) LS.set('prfc_me', JSON.stringify({token: S.token, me: S.me}));
  } catch(e){}
}
function typing(){ var a = document.activeElement; return !!(a && /INPUT|SELECT|TEXTAREA/.test(a.tagName) && a.closest('#view')); }
function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('on'); }, Math.max(2600, String(msg).length * 60)); }

function fmt(key, v){
  if (v == null || v === '') return '–';
  var t = TM[key] || {};
  if (t.mss) { var s = Math.round(v); return Math.floor(s/60) + ':' + ('0' + (s%60)).slice(-2); }
  var f = t.fmt || '0.#';
  if (f === '0.00') return v.toFixed(2);
  if (f === '0.0') return v.toFixed(1);
  if (f === '0') return String(Math.round(v));
  return String(Math.round(v*10)/10);
}
function unitOf(key){ var t = TM[key] || {}; if (t.mss || !t.unit) return ''; return t.unit === 'reps' ? ' reps' : ' ' + t.unit; }
function fmtU(key, v){ var b = fmt(key, v); return b === '–' ? b : b + unitOf(key); }
function label(key){ return (TM[key] && TM[key].label) || key; }
function waShare(text){ return 'https://wa.me/?text=' + encodeURIComponent(text); }

/* ---------------- navigation ---------------- */
function tabs(){
  var t = [['home','Squad','home'],['boards','Leaders','trophy'],['league','League','table'],['me','My page','user']];
  if (B.coach || S.pin || LS.get('prfc_coachmode')) t.push(['coach','Coach','clip']);
  return t;
}
function go(v){ S.view = v; render(); window.scrollTo(0,0); }
function renderNav(){
  var waiting = S.coach ? S.coach.waiting.length : 0;
  var h = tabs().map(function(t){
    var b = (t[0] === 'coach' && waiting) ? '<span class="badge">' + waiting + '</span>' : '';
    return '<button class="' + (S.view === t[0] ? 'on' : '') + '" onclick="go(\'' + t[0] + '\')">' + ic(t[2]) + '<span>' + t[1] + b + '</span></button>';
  }).join('');
  document.getElementById('bnav').innerHTML = h;
  document.getElementById('dnav').innerHTML = h;
}
var charts = [];
function render(){
  charts.forEach(function(c){ try { c.destroy(); } catch(e){} }); charts = [];
  renderNav();
  var v = document.getElementById('view');
  if (B.error && !S.squad) { v.innerHTML = '<div class="card"><div class="empty"><div class="em">⚠️</div><b>Could not load the squad data.</b><div class="small" style="margin-top:6px">' + esc(B.error) + '</div>' + (B.web ? '<button class="btn navy" style="margin-top:14px" onclick="B.error=\'\';render();boot()">Try again</button>' : '') + '</div></div>'; return; }
  if (!S.squad) { v.innerHTML = '<section class="card hero"><div class="sk" style="width:30%;opacity:.25"></div><div class="sk" style="width:60%;height:26px;opacity:.25"></div><div class="sk" style="width:45%;opacity:.25"></div></section><section class="card"><div class="sk" style="width:40%"></div><div class="sk"></div><div class="sk"></div><div class="sk" style="width:70%"></div></section>'; return; }
  var html = S.view === 'boards' ? vBoards() : S.view === 'league' ? vLeague() : S.view === 'me' ? vMe() : S.view === 'coach' ? vCoach() : vHome();
  v.innerHTML = html + '<div class="foot">Paisley RFC S&amp;C · ' + esc((S.squad && S.squad.season) || '') + ' · <a href="javascript:void 0" onclick="openPrivacy(false)" style="color:inherit">Privacy</a></div>';
  if (S.view === 'me' && S.me) drawRadars();
  updateSavebar();
  if (needsPrivacy() && !document.getElementById('modal').innerHTML) openPrivacy(true);
  privacyBanner();
}

/* ---------------- squad (home) ---------------- */
function vHome(){
  var q = S.squad, h = '';
  var nx = q.next, ls = q.last, lt = q.latest;
  h += '<section class="card hero">';
  if (nx) h += '<div class="kick">Next game</div><div class="big">' + (nx.ha === 'Away' ? '@ ' : 'v ') + esc(nx.opp) + '</div><div class="meta">' + esc(dLong(nx.date)) + (nx.ko ? ' · ' + esc(nx.ko) : '') + (nx.comp ? ' · ' + esc(nx.comp) : '') + '</div>'
    + (q.spond ? '<div class="meta" style="margin-top:6px"><a target="_blank" rel="noopener" href="' + esc(q.spond) + '" style="color:#fff;font-weight:700">Available? Say so on Spond ›</a></div>' : '');
  else h += '<div class="kick">' + esc(q.club) + ' S&amp;C</div><div class="big">Squad hub</div>';
  if (ls) h += '<div class="meta" style="margin-top:6px">Last time out: <b style="color:#fff">' + esc(ls.result) + '</b> ' + (ls.ha === 'Away' ? '@ ' : 'v ') + esc(ls.opp) + '</div>';
  h += leagueLine();
  if (lt && q.nextTesting) h += '<div class="meta" style="margin-top:6px">Next testing day: <b style="color:#fff">' + esc(dLong(q.nextTesting)) + '</b></div>';
  h += '<div class="stats">'
    + (lt ? '<div class="stat"><b>' + esc(lt.round) + '</b><span>Last testing · ' + esc(dShort(lt.date)) + '</span></div>'
          + '<div class="stat"><b>' + lt.tested + '</b><span>Players tested</span></div>'
          : '<div class="stat"><b>' + (q.nextTesting ? esc(dShort(q.nextTesting)) : 'TBC') + '</b><span>First testing day</span></div>'
          + '<div class="stat"><b>' + (q.squadSize || q.players.length) + '</b><span>In the squad</span></div>')
    + '<div class="stat"><b>' + q.pbsWeek + '</b><span>PBs this week</span></div></div></section>';
  h += '<div class="ctas"><button class="btn red" onclick="openPb()">' + ic('plus') + 'Log a PB</button>'
    + '<button class="btn line" onclick="go(\'' + (S.me || S.token ? 'me' : 'boards') + '\')">' + (S.me || S.token ? ic('user') + 'My page' : ic('trophy') + 'Leaderboards') + '</button></div>';
  if (fresh()) {
    h += '<div class="cols"><div>' + whatsOn() + howItWorks() + '</div><div>';
    h += '<section class="card"><div class="h-sec">Latest PBs</div>' + feedList(q.feed) + '</section>';
    return h + '</div></div>';
  }
  h += '<div class="cols"><div>';
  h += whatsOn();
  h += '<section class="card"><div class="h-sec">Latest PBs</div>' + feedList(q.feed) + '</section>';
  h += '<section class="card"><div class="h-sec">Most improved' + (q.latest && q.previous ? '<span class="more" style="cursor:default;color:var(--muted)">' + esc(q.previous) + ' → ' + esc(q.latest.round) + '</span>' : '') + '</div>' + improvedList() + '</section>';
  h += '</div><div>';
  h += '<section class="card"><div class="h-sec">Club records <button class="more" onclick="go(\'boards\')">Leaderboards</button></div>' + recordsGrid() + '</section>';
  h += '<section class="card"><div class="h-sec">Team check</div><div class="small muted" style="margin:-6px 0 10px">Share of players at the target for their position.</div>' + teamBars() + '</section>';
  h += '</div></div>';
  return h;
}
/* What's on: two-week mini calendar from the Season calendar and the fixtures, then the next few things. */
var KIND = {game: ['Game', '🏉'], testing: ['Testing day', '⏱️'], session: ['Session', '💪']};
function isoOf(d){ return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
function whatsOn(){
  var q = S.squad, items = q.week || [], today = q.today || todayIso();
  var t = new Date(Number(today.slice(0,4)), Number(today.slice(5,7)) - 1, Number(today.slice(8,10)));
  var mon = new Date(t); mon.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  var byDay = {}; items.forEach(function(x){ (byDay[x.date] = byDay[x.date] || []).push(x.kind); });
  var h = '<section class="card"><div class="h-sec">What’s on' + (q.spond ? '<a class="more" target="_blank" rel="noopener" href="' + esc(q.spond) + '">Book on Spond ›</a>' : '') + '</div>';
  h += '<div class="cal">' + ['M','T','W','T','F','S','S'].map(function(d){ return '<div class="h">' + d + '</div>'; }).join('');
  for (var i = 0; i < 14; i++) {
    var d = new Date(mon); d.setDate(mon.getDate() + i);
    var iso = isoOf(d), ks = byDay[iso] || [];
    var uniq = ks.filter(function(k, j){ return ks.indexOf(k) === j; });
    h += '<div class="d' + (iso === today ? ' today' : iso < today ? ' past' : '') + '">' + d.getDate() + '<div class="dots">' + uniq.map(function(k){ return '<i class="k-' + k + '"></i>'; }).join('') + '</div></div>';
  }
  h += '</div><div class="legend2"><span><i class="k-game"></i>Game</span><span><i class="k-testing"></i>Testing</span><span><i class="k-session"></i>Training / gym</span></div>';
  var next = items.filter(function(x){ return x.date >= today; }).slice(0, 5);
  if (!next.length) h += '<div class="small muted" style="margin-top:8px">Nothing planned yet. Coaches add sessions and testing days on the Season calendar.</div>';
  else h += next.map(function(x){
    var p = x.date.split('-'), dd = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return '<div class="ag"><div class="dt"><span>' + DAY[dd.getDay()] + '</span><b>' + dd.getDate() + '</b><span>' + MON[dd.getMonth()] + '</span></div><div class="kb k-' + x.kind + '"></div><div class="grow"><div class="name">' + esc(x.what) + '</div><div class="tiny muted">' + esc([x.kind === 'session' || x.what === KIND[x.kind][0] ? '' : KIND[x.kind][0], x.ko, x.sub].filter(Boolean).join(' · ')) + '</div></div></div>';
  }).join('');
  return h + '</section>';
}
/* A brand-new season: no testing results, records or PBs yet. */
function fresh(){ var q = S.squad; return !q.latest && !q.feed.length && !q.records.some(function(x){ return x.v != null; }); }
function howItWorks(){
  var st = function(n, t, d){ return '<div class="how"><b>' + n + '</b><div><div class="name">' + t + '</div><div class="small muted">' + d + '</div></div></div>'; };
  return '<section class="card"><div class="h-sec">How it works</div>'
    + st(1, 'Testing day', 'Coaches put in your sprints, jumps, runs and lifts. Every result lands here on the day.')
    + st(2, 'Log PBs any time', 'Hit a PB in the gym or on the track? Log it. Sensible ones count straight away.')
    + st(3, 'Climb the boards', 'Leaderboards, club records, and your own radar against the targets for your position.')
    + '<div class="tiny muted" style="margin-top:12px">Your own page comes as a private link from your coach. Open it once and this app remembers you.</div></section>';
}
function feedList(items){
  if (!items.length) return '<div class="empty"><div class="em">💪</div>No PBs yet. Be the first: tap <b>Log a PB</b>.</div>';
  var groups = [], idx = {};
  items.forEach(function(f){
    var k = f.src === 'Testing day' ? f.n + '|' + f.date : f.n + '|' + f.date + '|' + f.key;
    if (idx[k] == null) { idx[k] = groups.length; groups.push([]); }
    groups[idx[k]].push(f);
  });
  return '<div class="list">' + groups.slice(0, 8).map(function(g){
    var f = g[0];
    var msg = g.length > 1
      ? '🏉 ' + g.length + ' new PBs for ' + f.n + ' at testing day: ' + g.map(function(x){ return label(x.key) + ' ' + fmtU(x.key, x.v); }).join(', ') + '. Paisley RFC S&C ' + appUrl()
      : '🏉 New PB! ' + f.n + ' · ' + label(f.key) + ': ' + fmtU(f.key, f.v) + ' (was ' + fmtU(f.key, f.was) + '). Paisley RFC S&C ' + appUrl();
    var what = g.length > 1
      ? '<b style="color:var(--ink)">' + g.length + ' PBs</b> at testing day · ' + esc(g.slice(0, 2).map(function(x){ return label(x.key) + ' ' + fmtU(x.key, x.v); }).join(', ')) + (g.length > 2 ? '…' : '')
      : esc(label(f.key)) + ' <b class="val" style="color:var(--ink)">' + esc(fmtU(f.key, f.v)) + '</b> · was ' + esc(fmtU(f.key, f.was));
    var chk = g.length > 1 || f.src === 'Testing day' ? '' : f.sl ? ' <span class="tag sl">Self-logged</span>' : ' <span class="tag ck">Coach ✓</span>';
    return '<div class="item"><div class="av">' + esc(initials(f.n)) + '</div><div class="grow"><div class="name">' + esc(f.n) + chk + '</div><div class="small muted">' + what + '</div></div>'
      + '<div class="right tiny muted">' + esc(dShort(f.date)) + '</div><a class="share" target="_blank" rel="noopener" href="' + waShare(msg) + '" aria-label="Share on WhatsApp">' + ic('share') + '</a></div>';
  }).join('') + '</div>';
}
function improvedList(){
  var q = S.squad;
  if (!q.improved.length) return '<div class="empty"><div class="em">📈</div>Shows up after the second testing day.</div>';
  return '<div class="list">' + q.improved.slice(0, 6).map(function(x){
    return '<div class="item"><div class="av">' + esc(initials(x.n)) + '</div><div class="grow"><div class="name">' + esc(x.n) + '</div><div class="small muted">' + esc(label(x.key)) + ' · ' + esc(fmtU(x.key, x.from)) + ' → ' + esc(fmtU(x.key, x.to)) + '</div></div><div class="right delta up">▲ ' + x.pct + '%</div></div>';
  }).join('') + '</div>';
}
function recordsGrid(){
  var r = S.squad.records.filter(function(x){ return x.v != null; });
  if (!r.length) return '<div class="empty"><div class="em">🏆</div>Records fill in after the first testing day.</div>';
  if (window.innerWidth < 720) return '<div class="list rlist">' + r.map(function(x){
    return '<div class="item"><div class="grow"><div class="small muted">' + esc(x.label) + '</div><div class="name" style="font-weight:500">' + esc(x.n) + (x.sl ? ' <span class="tag sl">Self-logged</span>' : '') + '</div></div><div class="right"><div class="rv">' + esc(fmtU(x.key, x.v)) + '</div><div class="tiny muted">' + esc(dShort(x.date)) + '</div></div></div>';
  }).join('') + '</div>';
  return '<div class="recs">' + r.map(function(x){

function ordinal(n){ var s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v-20)%10] || s[v] || s[0]); }

function spark(t){

  var k = el.getAttribute('data-h'), t = TM[k] || {}, v = el.value.trim().replace(',', '.');
  if (t.mss && /^\d{3,4}$/.test(v)) { v = v.slice(0, -2) + ':' + v.slice(-2); }
  if (v !== el.value) { el.value = v; var p = el.getAttribute('data-p'); (S.t.dirty[p] = S.t.dirty[p] || {})[k] = v; saveDraft(); }
  el.classList.toggle('warn', warnFor(k, v));
});
document.addEventListener('keydown', function(e){
  var el = e.target; if (e.key !== 'Enter' || !el.getAttribute || !el.getAttribute('data-h')) return;
  e.preventDefault();
  var all = Array.prototype.slice.call(document.querySelectorAll('#prows input')).filter(function(x){ return x.offsetParent !== null; });
  var i = all.indexOf(el); if (i >= 0 && all[i+1]) all[i+1].focus();
});
function saveTesting(){
  var btn = document.getElementById('savebtn'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  var rows = Object.keys(S.t.dirty).filter(function(p){ return Object.keys(S.t.dirty[p]).length; }).map(function(p){ return {player: p, values: S.t.dirty[p]}; });
  saveDraft();
  call('api_saveTesting', S.pin, {date: S.t.date, round: S.t.round, rows: rows}).then(function(c){
    S.coach = c; S.t.dirty = {}; LS.del('prfc_tdraft');
    toast('Saved ' + c.saved.players + ' player' + (c.saved.players === 1 ? '' : 's') + ' ✓');
    render();
    call('api_squad').then(function(q){ S.squad = q; indexTests(); keep(); }).catch(function(){});
  }).catch(function(e){
    toast(e.message === NOSIG ? 'No signal. Your numbers are kept on this phone. Tap Save again when you’re back online.' : e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Save'; }
  });
}
function vInbox(){
  var C = S.coach, h = '<section class="card"><div class="h-sec">Waiting for you</div>';
  if (!C.waiting.length) h += '<div class="empty"><div class="em">✅</div>Nothing to check. Sensible PBs count by themselves.</div>';
  else h += C.waiting.map(function(x){
    var ok = /^(OK|Looks fine)/.test(x.check);
    return '<div class="inb"><div class="top2"><div class="av">' + esc(initials(x.name)) + '</div><div class="grow"><div class="name">' + esc(x.name) + '</div><div class="small muted">' + esc(label(x.test)) + ' · <b style="color:var(--ink)">' + esc(x.result) + '</b> · ' + esc(dShort(x.date)) + '</div></div></div>'
      + (x.notes ? '<div class="small" style="margin-top:6px">“' + esc(x.notes) + '”</div>' : '')
      + '<div class="chk ' + (ok ? 'ok' : 'bad') + '">' + esc(x.check || 'Check it') + '</div>'
      + '<div class="acts"><button class="btn line sm" onclick="inboxAct(' + x.row + ',this,\'reject\')" data-n="' + esc(x.name) + '">Bin it</button><button class="btn green sm" onclick="inboxAct(' + x.row + ',this,\'approve\')" data-n="' + esc(x.name) + '">Count it</button></div></div>';
  }).join('');
  h += '</section><section class="card"><div class="h-sec">Counted in the last 2 weeks</div><div class="small muted" style="margin:-6px 0 10px">' + (C.strictPbs ? 'Every PB waits for you first (Settings tab).' : 'Sensible PBs count straight away and show as <b>self-logged</b> until you tick them here.') + '</div>';
  if (!C.counted.length) h += '<div class="empty small">None yet.</div>';
  else h += '<div class="list">' + C.counted.map(function(x){
    var auto = x.by === 'Auto';
    return '<div class="item"><div class="grow"><div class="name">' + esc(x.name) + '</div><div class="small muted"><span class="tag ' + (auto ? 'sl">Self-logged' : 'ck">Coach ✓') + '</span> ' + esc(label(x.test)) + ' · ' + esc(x.result) + ' · ' + esc(dShort(x.date)) + (x.notes ? ' · “' + esc(x.notes) + '”' : '') + '</div></div>'
      + (auto ? '<button class="btn green sm" onclick="inboxAct(' + x.row + ',this,\'verify\')" data-n="' + esc(x.name) + '">Checked ✓</button>' : '')
      + '<button class="btn line sm" onclick="inboxAct(' + x.row + ',this,\'undo\')" data-n="' + esc(x.name) + '">Undo</button></div>';
  }).join('') + '</div>';
  return h + '</section>';
}
function inboxAct(row, btn, act){
  btn.disabled = true;
  call('api_inbox', S.pin, row, btn.getAttribute('data-n'), act).then(function(c){
    S.coach = c; toast(act === 'approve' ? 'Counted ✓' : act === 'verify' ? 'Marked as checked ✓' : act === 'reject' ? 'Binned' : 'Moved back to waiting'); render();
    call('api_squad').then(function(q){ S.squad = q; indexTests(); }).catch(function(){});
  }).catch(function(e){ toast(e.message); btn.disabled = false; });
}
function vRoundup(){
  var C = S.coach;
  return '<section class="card"><div class="h-sec">Weekly roundup</div><div class="small muted" style="margin:-6px 0 12px">Built from this week’s PBs and records. One tap posts it to the squad chat.</div>'
    + '<div class="pre" id="rutext">' + esc(C.roundup) + '</div><div class="ctas" style="margin:12px 0 0"><a class="btn green" target="_blank" rel="noopener" href="' + waShare(C.roundup) + '">' + ic('share') + 'Post to WhatsApp</a><button class="btn line" onclick="copyText(S.coach.roundup)">' + ic('copy') + 'Copy</button></div></section>';
}
function vLinks(){
  var C = S.coach;
  var squadMsg = 'Paisley RFC S&C app: leaderboards, club records, and log your PBs. ' + C.appUrl;
  var h = '<section class="card"><div class="h-sec">Squad link</div><div class="small muted" style="margin:-6px 0 12px">Post once in the squad chat. Anyone with it sees leaderboards, records and can log a PB.</div>'
    + '<div class="ctas" style="margin:0"><a class="btn green" target="_blank" rel="noopener" href="' + waShare(squadMsg) + '">' + ic('share') + 'Post to WhatsApp</a><button class="btn line" onclick="copyText(\'' + esc(C.appUrl) + '\')">' + ic('copy') + 'Copy link</button></div></section>';
  h += '<section class="card"><div class="h-sec">Personal links</div><div class="small muted" style="margin:-6px 0 12px">Each player’s private page. Send once by WhatsApp: tap, pick the player, send. Link passed around? Tap ↻ for a new one; the old one stops working.</div>'
    + '<input class="inp" placeholder="Find a player" oninput="var q=this.value.toLowerCase();document.querySelectorAll(\'.lk\').forEach(function(e){e.style.display=e.getAttribute(\'data-n\').indexOf(q)>=0?\'\':\'none\'})" style="margin-bottom:8px">';
  h += '<div class="list">' + C.players.map(function(p){
    var msg = 'Hi ' + p.name.split(' ')[0] + ', here’s your Paisley RFC S&C page: scores, targets and radars. Save it to your home screen. ' + p.link;
    var fresh = C.reset === p.name;
    return '<div class="item lk" data-n="' + esc(p.name.toLowerCase()) + '"' + (fresh ? ' style="background:#FFF6E0;border-radius:10px"' : '') + '><div class="av">' + esc(initials(p.name)) + '</div><div class="grow"><div class="name">' + esc(p.name) + '</div><div class="tiny muted">' + (fresh ? '<b style="color:var(--red)">New link made. Send it now.</b>' : esc(p.group || 'No position yet')) + '</div></div>'
      + '<button class="btn line sm" onclick="copyText(\'' + esc(p.link) + '\')" aria-label="Copy link">' + ic('copy') + '</button><a class="share" target="_blank" rel="noopener" href="' + waShare(msg) + '" aria-label="Send on WhatsApp">' + ic('share') + '</a>'
      + '<button class="btn lite sm" data-n="' + esc(p.name) + '" onclick="resetLink(this)" aria-label="Make a new link">' + ic('reset') + '</button></div>';
  }).join('') + '</div></section>';
  if (C.coachUrl) {
    var coachMsg = 'Paisley RFC S&C coach app: testing day, PB checks and the weekly roundup. Ask me for the coach PIN. ' + C.coachUrl;
    h += '<section class="card"><div class="h-sec">Coach link</div><div class="small muted" style="margin:-6px 0 12px">For other coaches. It opens straight into coach mode; they still need the PIN, so send that separately.</div>'
      + '<div class="ctas" style="margin:0"><a class="btn green" target="_blank" rel="noopener" href="' + waShare(coachMsg) + '">' + ic('share') + 'Send on WhatsApp</a><button class="btn line" onclick="copyText(\'' + esc(C.coachUrl) + '\')">' + ic('copy') + 'Copy link</button></div></section>';
  }
  return h;
}
/* Squad list: main position (sets targets) and availability, for everyone at once. */
var STATUSES = ['Available', 'Modified', 'Unavailable'];
function vSquadList(){
  var C = S.coach, d = S.sq = S.sq || {};
  var h = '<section class="card"><div class="h-sec">Squad list</div><div class="small muted" style="margin:-6px 0 12px">Main position sets each player’s targets. Players can also pick their own the first time they open their page. Modified = training with a niggle.</div>'
    + '<input class="inp" placeholder="Find a player" oninput="var q=this.value.toLowerCase();document.querySelectorAll(\'.sqr\').forEach(function(e){e.style.display=e.getAttribute(\'data-n\').indexOf(q)>=0?\'\':\'none\'})" style="margin-bottom:4px">';
  h += C.players.map(function(p){
    var x = d[p.name] || {}, pos = 'pos' in x ? x.pos : p.pos, st = 'status' in x ? x.status : p.status;
    return '<div class="sqr' + (d[p.name] ? ' chg' : '') + '" data-n="' + esc(p.name.toLowerCase()) + '"><div class="name">' + esc(p.name) + '</div>'
      + '<select class="inp" data-p="' + esc(p.name) + '" data-k="pos" onchange="sqSet(this)"><option value="">No position yet</option>' + C.positions.map(function(o){ return '<option' + (o === pos ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>'
      + '<select class="inp" data-p="' + esc(p.name) + '" data-k="status" onchange="sqSet(this)">' + STATUSES.map(function(o){ return '<option' + (o === st ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div>';
  }).join('');
  return h + '</section><div style="height:70px"></div>';
}
function sqSet(el){
  var p = el.getAttribute('data-p'), k = el.getAttribute('data-k');
  (S.sq[p] = S.sq[p] || {})[k] = el.value;
  var row = el.closest('.sqr'); if (row) row.classList.add('chg');
  updateSavebar();
}
function saveSquad(){
  var btn = document.getElementById('savebtn'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  var changes = Object.keys(S.sq).map(function(n){ var x = S.sq[n]; return {name: n, pos: x.pos, status: x.status}; });
  call('api_setPlayers', S.pin, changes).then(function(c){ S.coach = c; S.sq = {}; toast('Saved ' + changes.length + ' player' + (changes.length === 1 ? '' : 's') + ' ✓'); render(); refreshData(); })
    .catch(function(e){ toast(e.message); if (btn) { btn.disabled = false; btn.textContent = 'Save'; } });
}
function resetLink(btn){
  var name = btn.getAttribute('data-n');
  if (!btn.classList.contains('sure')) {
    btn.classList.add('sure'); btn.textContent = 'New link?';
    setTimeout(function(){ if (btn.isConnected && !btn.disabled) { btn.classList.remove('sure'); btn.innerHTML = ic('reset'); } }, 3500);
    return;
  }
  btn.disabled = true; btn.textContent = '…';
  call('api_resetLink', S.pin, name).then(function(c){ S.coach = c; render(); toast('New link made for ' + name + '. The old one no longer works.'); })
    .catch(function(e){ toast(e.message); btn.disabled = false; btn.classList.remove('sure'); btn.innerHTML = ic('reset'); });
}
function copyText(t){
  var done = function(){ toast('Copied ✓'); };
  try { if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(t).then(done, function(){ fallback(); }); return; } } catch(e){}
  fallback();
  function fallback(){ var a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); done(); } catch(e){ toast('Press and hold to copy'); } a.remove(); }
}

function refreshData(){
  call('api_refresh', S.me ? S.token : '').then(function(d){ if (d.squad) { S.squad = d.squad; indexTests(); } if (d.me) S.me = d.me; keep(); if (!document.getElementById('pbbody') && !typing()) render(); }).catch(function(){});
}

/* ---------------- start ---------------- */
function setSub(){ if (S.squad) document.getElementById('sub').textContent = 'S&C hub · ' + (S.squad.season || ''); }
/* Keep the player's link in the address bar, so "Add to Home Screen" makes an icon that opens their own page. */
function tokenInUrl(t){
  if (!B.web || B.coach || !window.history || !history.replaceState) return;
  try { var u = new URL(location.href); if (t) u.searchParams.set('p', t); else u.searchParams.delete('p'); history.replaceState(null, '', u.toString()); } catch(e){}
}
function boot(){
  call('api_boot', S.token).then(function(d){
    S.squad = d.squad; indexTests(); setSub();
    if (d.me) { S.me = d.me; LS.set('prfc_token', S.token); tokenInUrl(S.token); }
    if (d.badToken) { LS.del('prfc_token'); LS.del('prfc_me'); S.token = ''; S.me = null; S.linkGone = true; tokenInUrl(''); if (S.view !== 'me' && S.view !== 'coach') toast('That personal link doesn’t work any more.'); }
    if (d.league && (!S.league || !S.league.fetched || String(d.league.fetched) >= String(S.league.fetched))) S.league = d.league;
    keep();
    if (typing() || document.getElementById('pbbody')) renderNav(); else render();
    loadLeague();
  }).catch(function(e){
    if (!S.squad) { B.error = e.message; render(); }
    else toast(e.message === NOSIG ? 'No signal. Showing the last saved numbers.' : e.message);
  });
}
document.getElementById('crest').src = B.crest ? 'data:image/png;base64,' + B.crest : B.appUrl + 'icons/crest.png';
setSub();
render();
if (B.web) {
  boot();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register(B.appUrl + 'sw.js').catch(function(){});
} else {
  loadLeague();
  if (!S.me && S.token) {
    call('api_me', S.token).then(function(m){ S.me = m; if (S.view === 'me' || S.view === 'boards') render(); else renderNav(); })
      .catch(function(){ LS.del('prfc_token'); S.token = ''; S.linkGone = true; if (S.view === 'me') render(); });
  }
  if (B.badToken && S.view === 'home') toast('That personal link doesn’t work any more.');
}
</script>
</body>
</html>
